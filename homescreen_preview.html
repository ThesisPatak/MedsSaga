<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedsSaga Home Screen - Toca Boca Design</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Arial Black', Arial, sans-serif;
            background: linear-gradient(135deg, #d8b4fe 0%, #c4b5fd 100%);
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container { 
            width: 100%;
            max-width: 1400px;
        }
        .title {
            text-align: center;
            font-size: 48px;
            color: #6b21a8;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .screen-wrapper {
            background: #b78ef5;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 4px solid #000;
            display: flex;
            gap: 16px;
            min-height: 600px;
        }
        
        /* SIDEBAR */
        .sidebar {
            width: 70px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            padding-top: 10px;
        }
        .menu-icon {
            width: 54px;
            height: 54px;
            background: #fff;
            border: 3px solid #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        /* MAIN CONTENT */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        /* CROSS BOX */
        .cross-box {
            background: #fff;
            border: 4px solid #000;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            color: #9333ea;
            font-weight: 900;
            min-height: 120px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        /* WINDOW/BLINDS */
        .window-blinds {
            background: #8cc4ff;
            border: 3px solid #000;
            border-radius: 8px;
            height: 40px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .blind-line {
            height: 2px;
            background: #fff;
        }
        
        /* BUTTONS SECTION */
        .buttons-row {
            display: flex;
            gap: 10px;
            flex: 1;
        }
        .game-btn {
            flex: 1;
            background: #fff;
            border: 4px solid #000;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 36px;
            font-weight: 900;
            color: #9333ea;
            position: relative;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .game-btn:hover {
            transform: translateY(-2px);
        }
        .rope {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #d97757;
            border-radius: 50%;
            border: 2px solid #8b4513;
        }
        .rope-left-top {
            left: 16px;
            top: 14px;
        }
        .rope-right-top {
            right: 16px;
            top: 14px;
        }
        .rope-left-bottom {
            left: 16px;
            bottom: 14px;
        }
        .rope-right-bottom {
            right: 16px;
            bottom: 14px;
        }
        .rope-string {
            position: absolute;
            width: 18px;
            height: 3px;
            background: #d97757;
            left: 50%;
            margin-left: -9px;
        }
        
        /* CHARACTERS */
        .characters-box {
            background: #fff;
            border: 4px solid #000;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            gap: 4px;
            flex: 1;
            justify-content: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .character {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .char-avatar {
            width: 100%;
            aspect-ratio: 0.6;
            border: 3px solid #000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            font-weight: bold;
        }
        .char-name {
            font-size: 10px;
            font-weight: 900;
            color: #1f2937;
        }
        .nina { background: #ffb0d0; }
        .milo { background: #8cc4ff; }
        .lina { background: #ffd46e; }
        .noah { background: #b4a0ff; }
        
        /* STATS BAR */
        .stats {
            display: flex;
            gap: 10px;
            height: 55px;
        }
        .stat-item {
            flex: 1;
            background: #fff;
            border: 3px solid #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 900;
            color: #9333ea;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🏥 MedsSaga Home Screen</div>
        
        <div class="screen-wrapper">
            <!-- SIDEBAR -->
            <div class="sidebar">
                <div class="menu-icon">📋</div>
                <div class="menu-icon">👤</div>
                <div class="menu-icon">📊</div>
            </div>
            
            <!-- MAIN CONTENT -->
            <div class="main">
                <!-- Cross Symbol -->
                <div class="cross-box">✚</div>
                
                <!-- Window/Blinds -->
                <div class="window-blinds">
                    <div class="blind-line"></div>
                    <div class="blind-line"></div>
                    <div class="blind-line"></div>
                    <div class="blind-line"></div>
                </div>
                
                <!-- Buttons -->
                <div class="buttons-row">
                    <div class="game-btn" style="font-size: 32px;">
                        <div class="rope rope-left-top"></div>
                        <div style="text-align: center; line-height: 1.2;">
                            NEW<br>GAME
                        </div>
                        <div class="rope rope-right-top"></div>
                    </div>
                    
                    <div class="game-btn" style="font-size: 40px;">
                        <div class="rope rope-left-top"></div>
                        LOAD
                        <div class="rope rope-right-top"></div>
                    </div>
                </div>
                
                <!-- Characters -->
                <div class="characters-box">
                    <div class="character">
                        <div class="char-avatar nina">👩‍⚕️</div>
                        <div class="char-name">Nina</div>
                    </div>
                    <div class="character">
                        <div class="char-avatar milo">👨‍⚕️</div>
                        <div class="char-name">Milo</div>
                    </div>
                    <div class="character">
                        <div class="char-avatar lina">👩‍⚕️</div>
                        <div class="char-name">Lina</div>
                    </div>
                    <div class="character">
                        <div class="char-avatar noah">👨‍⚕️</div>
                        <div class="char-name">Noah</div>
                    </div>
                </div>
                
                <!-- Stats -->
                <div class="stats">
                    <div class="stat-item">Level: 1</div>
                    <div class="stat-item">Score: 0</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
